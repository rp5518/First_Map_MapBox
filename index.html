<!--
FILE OVERVIEW
This page is the main canvassing map for the First_Map_MapBox workflow.
It renders a Mapbox GL map from household marker data in markers.json, supports
zone-based filtering and numbering, and keeps canvassing state in sync with
Firebase Firestore so multiple users can share marker notes and outcomes.

CORE USER FLOW
1) A user opens the page and is prompted by a password overlay.
2) After authentication, the map initializes and loads marker data from markers.json.
3) Each marker is drawn on the map with a label that reflects either the overall
   sequence or the active zone sequence, depending on the current view.
4) Zone selection filters the visible markers and re-centers the map around them.
5) Marker popups allow the user to record canvassing outcomes, flags, and notes.
6) Firestore listeners keep marker colors, shapes, and notes synchronized for all clients.
7) Admin-only bulk reset actions are available on desktop-class devices and can target
   all markers or only the currently selected zone.

DATA SOURCES
- markers.json (same folder): Marker payload with name, address, lng, lat, and optional
  age, party, and zone values.
- Firestore collection markerStates: Per-address canvassing state, flag, notes, and manual 
  update location/distance metadata (manualUpdateDistanceFeet, manualUpdateLocation).
- Firestore doc mapSettings/markerVersion: Version/hash tracking for marker set changes.

MAJOR FEATURES
- Password-gated access and separate admin unlock flow.
- Zone selector with immediate map fit-to-visible-markers behavior.
- Geocoder search, browser geolocation, and custom current-location marker.
- Numeric marker labels with optional star/flag styling.
- Popup controls for friendly, not-friendly, and dropped-literature outcomes.
- Timestamped note history and bulk reset modes for state-only, state+notes, or full reset.

RUNTIME REQUIREMENTS
- Mapbox GL JS and Mapbox Geocoder plugin from CDN.
- Firebase app + Firestore compat SDKs.
- A valid Mapbox token from local-config.js, localStorage, or the built-in fallback.
- reset-markers.js module for bulk reset helpers.
- HTTP serving (for example VS Code Live Server), not file://.

MAINTENANCE NOTES
- Keep markers.json schema compatible with the fetch/render logic.
- Firestore document IDs are derived from sanitized address strings.
- Any marker address change can affect version-hash reset behavior.
-->

            const desktopAdminMedia = window.matchMedia(DESKTOP_ADMIN_MEDIA_QUERY);

            function canShowAdminResetControls() {
                return desktopAdminMedia.matches;
            }

            function syncAdminResetControls() {
                if (!canShowAdminResetControls()) {
                    unlockAdminButton.classList.add('hidden');
                    resetAllButton.classList.add('hidden');
                    return;
                }

                if (resetAllButton.classList.contains('hidden')) {
                    unlockAdminButton.classList.remove('hidden');
                } else {
                    unlockAdminButton.classList.add('hidden');
                }
            }

            function requestAdminResetUnlock() {
                if (!canShowAdminResetControls()) {
                    return false;
                }

                const enteredCode = window.prompt('Enter admin reset code to enable bulk marker reset:');
                if (enteredCode === null) {
                    return false;
                }

                if (enteredCode === ADMIN_RESET_CODE) {
                    resetAllButton.classList.remove('hidden');
                    unlockAdminButton.classList.add('hidden');
                    alert('Admin controls enabled.');
                    return true;
                }

                alert('Invalid admin reset code.');
                return false;
            }

            // Handle password submission

                const enteredPassword = passwordInput.value;
                if (enteredPassword === CORRECT_PASSWORD) {

                    passwordOverlay.classList.add('hidden');
                    container.classList.remove('hidden');
                    // Only show admin reset controls on desktop-class devices.
                    resetAllButton.classList.add('hidden');
                    syncAdminResetControls();
                    // Initialize the map after password is correct
                    initializeMap();
                } else {
                    // Wrong password - show error
                    passwordError.style.display = 'block';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }

            // Event listeners for password form
            passwordSubmit.addEventListener('click', checkPassword);
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    checkPassword();
                }
            });

            // Hide error when user starts typing
            passwordInput.addEventListener('input', function() {
                passwordError.style.display = 'none';
            });

            unlockAdminButton.addEventListener('click', requestAdminResetUnlock);
            desktopAdminMedia.addEventListener('change', syncAdminResetControls);

        function metersToFeet(meters) {
            return meters * 3.280839895;
        }

        function haversineFeet(lat1, lon1, lat2, lon2) {
            const toRad = Math.PI / 180;
            const dLat = (lat2 - lat1) * toRad;
            const dLon = (lon2 - lon1) * toRad;
            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            const earthMeters = 6371000;
            return metersToFeet(earthMeters * c);
        }

        function ensureProximityAudioContext() {
            if (!proximityAudioContext) {
                proximityAudioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return proximityAudioContext;
        }

        async function playProximityBeep() {
            try {
                const audioCtx = ensureProximityAudioContext();
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                const oscillator = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.value = 880;
                gain.gain.value = 0.001;

                oscillator.connect(gain);
                gain.connect(audioCtx.destination);

                const current = audioCtx.currentTime;
                gain.gain.exponentialRampToValueAtTime(0.13, current + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, current + 0.18);

                oscillator.start(current);
                oscillator.stop(current + 0.2);
            } catch (error) {
                console.warn('Proximity beep failed:', error);
            }
        }

        async function tryAutoMarkVisited(targetObj, distanceFeet) {
            const addressId = createAddressId(targetObj.address);
            const markerStateRef = db.collection('markerStates').doc(addressId);

            const result = await db.runTransaction(async (transaction) => {
                const stateDoc = await transaction.get(markerStateRef);
                const data = stateDoc.exists ? stateDoc.data() : {};
                const currentState = String(data.state || '').trim();

                if (currentState !== '') {
                    return { changed: false, state: currentState };
                }

                transaction.set(markerStateRef, {
                    state: 'visited',
                    updatedBy: 'proximity',
                    proximityTimestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                return { changed: true };
            });

            if (result.changed) {
                proximityCooldownMsById.set(addressId, Date.now());
                setProximityStatus(true, `Auto-marked: ${Math.round(distanceFeet)} ft from target`, false);
                await playProximityBeep();
                console.log('Auto-marked marker as visited:', targetObj.address);
            } else {
                setProximityStatus(true, `Skipped (already ${result.state || 'set'})`, false);
            }

            }
            if (!markerObjects.length) {
                setProximityStatus(true, 'Waiting for marker list to load...');
                return;
            }

            const settings = getAutoSelectSettings();
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            const accuracyFeet = metersToFeet(position.coords.accuracy);

            if (accuracyFeet > settings.maxAccuracyFeet) {
                setProximityStatus(true, `GPS accuracy low (${Math.round(accuracyFeet)} ft)`);
                return;
            }

            if (proximityLastEvalPosition) {
                const moveDistanceFeet = haversineFeet(
                    proximityLastEvalPosition.lat,
                    proximityLastEvalPosition.lng,
                    latitude,
                    longitude
                );

                if (moveDistanceFeet < settings.minMoveFeet) {
                    return;
                }
            }

            proximityLastEvalPosition = { lat: latitude, lng: longitude };

            const candidateMarkers = getVisibleMarkers().length ? getVisibleMarkers() : markerObjects;
            let nearest = null;
            let secondNearest = null;

            candidateMarkers.forEach(obj => {
                const markerLngLat = obj.marker.getLngLat();
                const distanceFeet = haversineFeet(latitude, longitude, markerLngLat.lat, markerLngLat.lng);
                const candidate = { obj, distanceFeet };

                if (!nearest || candidate.distanceFeet < nearest.distanceFeet) {
                    secondNearest = nearest;
                    nearest = candidate;
                } else if (!secondNearest || candidate.distanceFeet < secondNearest.distanceFeet) {
                    secondNearest = candidate;
                }
            });

            if (!nearest) {
                setProximityStatus(true, 'No nearby marker found');
                return;
            }

            if (nearest.distanceFeet > settings.thresholdFeet) {
                setProximityStatus(true, `Nearest marker ${Math.round(nearest.distanceFeet)} ft`);
                return;
            }

            if (secondNearest && nearest.distanceFeet + settings.nearestMarginFeet >= secondNearest.distanceFeet) {
                setProximityStatus(true, 'Ambiguous nearest marker, waiting');
                return;
            }

            const nearestId = createAddressId(nearest.obj.address);
            const lastMarkedAt = proximityCooldownMsById.get(nearestId) || 0;
            if (Date.now() - lastMarkedAt < settings.cooldownMs) {
                return;
            }

            tryAutoMarkVisited(nearest.obj, nearest.distanceFeet).catch(error => {
                console.error('Auto-mark transaction error:', error);
                const reason = error && error.code ? error.code : (error && error.message) || 'unknown error';
                setProximityStatus(true, `Auto-mark failed: ${reason}`, true);
            });
        }

        function startProximityTracking() {
            if (proximityTrackingEnabled) {
                return;
            }
            proximityTrackingEnabled = true;
            proximityLastEvalPosition = null;
            ensureProximityAudioContext();
            setProximityStatus(true, 'Auto Select enabled. Hold 3 seconds to disable.');
        }

        function stopProximityTracking() {
            proximityTrackingEnabled = false;
            setProximityStatus(false, 'Auto Select disabled. Hold 3 seconds to enable.');
        }

        function beginProximityHoldToggle(event) {
            if (event.type === 'mousedown' && event.button !== 0) {
                return;
            }

            proximityHoldTriggered = false;
            proximityStatusBadge.classList.add('holding');

            if (proximityHoldTimeoutId) {
                clearTimeout(proximityHoldTimeoutId);
            }

            proximityHoldTimeoutId = setTimeout(() => {
                proximityHoldTriggered = true;
                if (proximityTrackingEnabled) {
                    stopProximityTracking();
                } else {
                    startProximityTracking();
                }
                proximityHoldJustCommitted = true;
                proximityStatusBadge.classList.remove('holding');
                setTimeout(() => {
                    proximityHoldJustCommitted = false;
                }, 0);
            }, 3000);
        }

        function cancelProximityHoldToggle() {
            if (proximityHoldTimeoutId) {
                clearTimeout(proximityHoldTimeoutId);
                proximityHoldTimeoutId = null;
            }

            if (proximityHoldJustCommitted) {
                proximityStatusBadge.classList.remove('holding');
                proximityHoldTriggered = false;
                return;
            }

            proximityStatusBadge.classList.remove('holding');

            if (!proximityHoldTriggered) {
                setProximityStatus(
                    proximityTrackingEnabled,
                    'Hold for 3 seconds to toggle Auto Select.'
                );
            }
        }

        function zoomToIncludeMe() {
            pauseSpinning();
            const visibleMarkers = getVisibleMarkers();
            if (visibleMarkers.length === 0 && !currentLocationMarker) return;

            const bounds = new mapboxgl.LngLatBounds();

            visibleMarkers.forEach(obj => {
                const lngLat = obj.marker.getLngLat();
                bounds.extend([lngLat.lng, lngLat.lat]);
            });

            if (currentLocationMarker) {
                const currentLngLat = currentLocationMarker.getLngLat();
                bounds.extend([currentLngLat.lng, currentLngLat.lat]);
            }

            map.fitBounds(bounds, {
                padding: 50,
                maxZoom: 16
            });
        }

        function beginZoomButtonHold(event) {
            if (event.type === 'mousedown' && event.button !== 0) {
                return;
            }

            zoomButtonHoldTriggered = false;

            if (zoomButtonHoldTimeoutId) {
                clearTimeout(zoomButtonHoldTimeoutId);
            }

            zoomButtonHoldTimeoutId = setTimeout(() => {
                zoomButtonHoldTriggered = true;
                toggleAutoSelectSettingsPanel();
            }, 3000);
        }

        function cancelZoomButtonHold() {
            if (zoomButtonHoldTimeoutId) {
                clearTimeout(zoomButtonHoldTimeoutId);
                zoomButtonHoldTimeoutId = null;
            }
        }

        // Function to create a custom current location marker
        function createCurrentLocationMarker() {
            const el = document.createElement('div');
            el.style.backgroundColor = '#FF0000'; // Red color for current location
            el.style.width = '20px';
            el.style.height = '20px';
            el.style.borderRadius = '50%';
            el.style.display = 'flex';
            el.style.alignItems = 'center';
            el.style.justifyContent = 'center';
            el.style.color = 'white';
            el.style.fontWeight = 'bold';
            el.style.fontSize = '12px';
            el.style.border = '3px solid white';
            el.style.boxShadow = '0 0 10px rgba(0,0,0,0.5)';
            el.textContent = '📍';
            return el;
        }

        // Track user's current location
        function trackCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const { longitude, latitude } = position.coords;
                        
                        // Remove existing current location marker
                        if (currentLocationMarker) {
                            currentLocationMarker.remove();
                        }
                        
                        // Create new current location marker
                        const locationMarkerEl = createCurrentLocationMarker();
                        
                        const popup = new mapboxgl.Popup({ offset: 25 })
                            .setHTML(`
                                <strong>Your Current Location</strong><br>
                                Lat: ${latitude.toFixed(6)}<br>
                                Lng: ${longitude.toFixed(6)}<br>
                                <small>Accuracy: ±${position.coords.accuracy}m</small>
                            `);
                        
                        currentLocationMarker = new mapboxgl.Marker(locationMarkerEl)
                            .setLngLat([longitude, latitude])
                            .setPopup(popup)
                            .addTo(map);

                        proximityCurrentPosition = position;
                        evaluateProximity(position);
                        
                        console.log('Location updated:', latitude, longitude);
                    },
                    (error) => {
                        console.error('Geolocation error:', error);
                        if (!locationAlertShown) {
                            alert('Unable to retrieve your location. Please enable location services.');
                            locationAlertShown = true;
                        }
                        setProximityStatus(false, `Location unavailable: ${error.message || error.code}`, true);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 10000 // Cache location for 10 seconds
                    }
                );
            } else {
                alert('Geolocation is not supported by this browser.');
            }
        }

        // Start tracking location when map loads
        map.on('load', () => {
            trackCurrentLocation();
        });

        // Store marker references and visited state
        let markerObjects = [];
        const markerByAddressId = new Map();
        const markerStateCache = new Map();
        const pendingMarkerStateUpdates = new Map();
        let markerUpdateFrameId = null;
        const zoneFilterPanel = document.getElementById('zone-filter-panel');
        const zoneSelect = document.getElementById('zone-select');
        const zoomToIncludeMeButton = document.getElementById('zoom-to-include-me');
        let zoneFilteringEnabled = false;
        let requiresZoneSelection = false;
        const zoneSequenceLookup = new Map();

        setProximityControlsVisible(true);
        startProximityTracking();
        autoSelectSettingsPanel.classList.add('hidden');

        function normalizeZoneLabel(zoneValue) {
            const raw = String(zoneValue || '').trim();
            if (!raw) return '';

            const numericMatch = raw.match(/^#?\s*(\d+)$/);
            if (numericMatch) return `Zone #${numericMatch[1]}`;

            const zoneMatch = raw.match(/^zone[\s_#-]*(\d+)$/i);
            if (zoneMatch) return `Zone #${zoneMatch[1]}`;

            return raw;
        }

        function getMarkerZone(marker) {
            return normalizeZoneLabel(marker.zone || marker.assignedZone || marker.zoneNumber || marker.zone_id || '');
        }

        function sortZoneLabels(a, b) {
            const aMatch = a.match(/^Zone #(\d+)$/i);
            const bMatch = b.match(/^Zone #(\d+)$/i);

            if (aMatch && bMatch) {
                return Number(aMatch[1]) - Number(bMatch[1]);
            }
            if (aMatch) return -1;
            if (bMatch) return 1;
            return a.localeCompare(b);
        }

        function getVisibleMarkers() {
            return zoneFilteringEnabled ? markerObjects.filter(obj => obj.isVisible) : markerObjects;
        }

        function queueMarkerStateUpdate(addressId, data) {
            pendingMarkerStateUpdates.set(addressId, data || {});
            if (markerUpdateFrameId !== null) {
                return;
            }
            markerUpdateFrameId = requestAnimationFrame(() => {
                markerUpdateFrameId = null;
                const updates = Array.from(pendingMarkerStateUpdates.entries());
                pendingMarkerStateUpdates.clear();
                updates.forEach(([queuedAddressId, queuedData]) => {
                    applyMarkerStateUpdate(queuedAddressId, queuedData);
                });
            });
        }

        function renderNotesHistory(historyDiv, notesHistory) {
            if (!notesHistory || notesHistory.length === 0) {
                historyDiv.innerHTML = '<em>No notes yet</em>';
                return;
            }
            historyDiv.innerHTML = notesHistory
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
                .map(note => `
                    <div style="margin-bottom: 8px; padding: 5px; 
                               background-color: white; border-left: 3px solid #4CAF50;">
                        <div style="font-weight: bold; color: #666; font-size: 10px;">
                            ${note.timestamp}
                        </div>
                        <div style="margin-top: 2px;">
                            ${note.text}
                        </div>
                    </div>
                `).join('');
        }

        function applyMarkerStateUpdate(addressId, data) {
            const obj = markerByAddressId.get(addressId);
            if (!obj) {
                return;
            }

            const state = data.state || '';
            const flag = !!data.flag;
            const notesHistory = data.notesHistory || [];
            const idx = obj.idx;

            obj.popupContent.querySelector(`#friendly-${idx}`).checked = state === 'friendly';
            obj.popupContent.querySelector(`#notfriendly-${idx}`).checked = state === 'notfriendly';
            obj.popupContent.querySelector(`#visited-${idx}`).checked = state === 'visited';
            obj.popupContent.querySelector(`#flag-${idx}`).checked = flag;

            if (state === 'friendly') obj.markerEl.style.backgroundColor = '#32CD32';
            else if (state === 'notfriendly') obj.markerEl.style.backgroundColor = '#FF4500';
            else if (state === 'visited') obj.markerEl.style.backgroundColor = '#B39DDB';
            else obj.markerEl.style.backgroundColor = '#FFFF00';

            setMarkerShape(obj.markerEl, flag, getMarkerDisplayLabel(idx, obj.zone));

            if (obj.popup && obj.popup.isOpen()) {
                const historyDiv = obj.popupContent.querySelector(`#notes-history-${idx}`);
                renderNotesHistory(historyDiv, notesHistory);
            }

            markerStateCache.set(addressId, {
                state,
                flag,
                notesHistory
            });
        }

        function getMarkerDisplayLabel(markerIndex, markerZone) {
            const selectedZone = zoneFilteringEnabled ? zoneSelect.value : '';
            if (selectedZone === 'all' && markerZone && zoneSequenceLookup.has(markerZone)) {
                return String(zoneSequenceLookup.get(markerZone));
            }
            return String(markerIndex + 1);
        }

        function refreshAllMarkerLabels() {
            markerObjects.forEach(obj => {
                obj.markerEl.textContent = getMarkerDisplayLabel(obj.idx, obj.zone);
            });
        }

        function fitToMarkers(markerList) {
            if (!markerList || markerList.length === 0) return;

            const bounds = new mapboxgl.LngLatBounds();
            markerList.forEach(obj => {
                const lngLat = obj.marker.getLngLat();
                bounds.extend([lngLat.lng, lngLat.lat]);
            });

            map.fitBounds(bounds, {
                padding: 50,
                maxZoom: 16
            });
        }

        function zoomToVisibleMarkersNow() {
            const visibleMarkers = getVisibleMarkers();
            if (visibleMarkers.length === 0) return;

            // Stop the globe animation and force a resize before fitting.
            // This prevents occasional blank-map frames on some mobile browsers.
            pauseSpinning();
            map.resize();

            // Defer fit one frame so marker add/remove operations are settled first.
            requestAnimationFrame(() => {
                fitToMarkers(getVisibleMarkers());
            });
        }

        function applyZoneFilter(selectedZone, shouldFit = false) {
            if (!zoneFilteringEnabled) return;

            markerObjects.forEach(obj => {
                const shouldShow = selectedZone === 'all' || obj.zone === selectedZone;

                if (shouldShow && !obj.isVisible) {
                    obj.marker.addTo(map);
                    obj.isVisible = true;
                } else if (!shouldShow && obj.isVisible) {
                    obj.marker.remove();
                    obj.isVisible = false;
                }
            });

            refreshAllMarkerLabels();

            if (shouldFit) {
                fitToMarkers(getVisibleMarkers());
            }
        }

        function setMainMapButtonsVisible(visible) {
            zoomToIncludeMeButton.classList.toggle('hidden', !visible);
        }

        function lockZoneSelection(selectedZone) {
            applyZoneFilter(selectedZone, false);
            zoomToVisibleMarkersNow();
            if (selectedZone === 'all') {
                // Keep the panel visible and allow zooming across all markers.
                zoneFilterPanel.classList.remove('hidden');
                setMainMapButtonsVisible(true);
            } else {
                // A specific zone was chosen — hide the panel and show zoom buttons.
                requiresZoneSelection = false;
                zoneFilterPanel.classList.add('hidden');
                setMainMapButtonsVisible(true);
            }
        }

        function showAllZonesFromHistory() {
            if (!zoneFilteringEnabled || zoneSelect.value === 'all') return;

            zoneSelect.value = 'all';
            lockZoneSelection('all');
        }

        window.addEventListener('popstate', showAllZonesFromHistory);

        function initializeZoneFilter(markers) {
            const zones = new Set();

            markers.forEach(marker => {
                const zone = getMarkerZone(marker);
                if (zone) {
                    zones.add(zone);
                }
            });

            if (zones.size === 0) {
                zoneFilteringEnabled = false;
                zoneSequenceLookup.clear();
                zoneFilterPanel.classList.add('hidden');
                zoneSelect.value = 'all';
                setMainMapButtonsVisible(true);
                return;
            }

            zoneFilteringEnabled = true;

            const zoneList = Array.from(zones).sort(sortZoneLabels);
            zoneSequenceLookup.clear();
            zoneList.forEach((zone, zoneIndex) => {
                zoneSequenceLookup.set(zone, zoneIndex + 1);
            });
            zoneSelect.innerHTML = '';

            requiresZoneSelection = zoneList.length > 1;
            if (requiresZoneSelection) {
                const selectPromptOption = document.createElement('option');
                selectPromptOption.value = '';
                selectPromptOption.textContent = 'Select a Zone';
                zoneSelect.appendChild(selectPromptOption);
            }

            const allZonesOption = document.createElement('option');
            allZonesOption.value = 'all';
            allZonesOption.textContent = 'All Zones';
            zoneSelect.appendChild(allZonesOption);

            zoneList.forEach(zone => {
                const option = document.createElement('option');
                option.value = zone;
                option.textContent = zone;
                zoneSelect.appendChild(option);
            });

            if (requiresZoneSelection) {
                setMainMapButtonsVisible(false);
                zoneFilterPanel.classList.remove('hidden');
                zoneSelect.value = '';
                applyZoneFilter('', false);
            } else {
                const defaultZone = zoneList[0];
                zoneSelect.value = defaultZone;
                zoneFilterPanel.classList.add('hidden');
                setMainMapButtonsVisible(true);
                applyZoneFilter(defaultZone, true);
            }
        }

        // Function to create a custom marker element with a visible numeric label
        function createMarkerElement(label) {
            const el = document.createElement('div');
            el.style.backgroundColor = '#FFFF00'; // Always start as yellow
            el.style.width = '28px';
            el.style.height = '28px';
            el.style.borderRadius = '50%';
            el.style.display = 'flex';
            el.style.alignItems = 'center';
            el.style.justifyContent = 'center';
            el.style.color = 'black';
            el.style.fontWeight = 'bold';
            el.style.fontSize = '16px';
            el.style.border = '2px solid black';
            el.textContent = label;
            return el;
        }

        // Place this BEFORE fetch('markers.json')
        function setMarkerShape(markerEl, isStar, label) {
            if (isStar) {
                markerEl.style.backgroundColor = markerEl.style.backgroundColor || '#FFFF00';
                markerEl.style.width = '42px';
                markerEl.style.height = '42px';
                markerEl.style.borderRadius = '0';
                markerEl.style.fontSize = '16px';
                markerEl.style.clipPath = 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)';
                markerEl.textContent = label;
            } else {
                markerEl.style.width = '28px';
                markerEl.style.height = '28px';
                markerEl.style.borderRadius = '50%';
                markerEl.style.clipPath = '';
                markerEl.style.border = '2px solid black';
                markerEl.style.fontSize = '16px';
                markerEl.textContent = label;
            }
        }

        // Load markers from markers.json and add to map with numeric labels
        console.log('Starting to fetch markers.json...');
        console.log('Map object:', map);
        fetch('markers.json')
            .then(response => {
                console.log('Fetch response status:', response.status);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(markers => {
                console.log('Loading markers...', markers.length, 'markers found');
                console.log('First marker:', markers[0]);

                initializeZoneFilter(markers);
                
                // Create marker hash for version tracking
                const currentMarkersHash = JSON.stringify(markers.map(m => m.address).sort());
                
                console.log('Loading markers - real-time sync active');
                
                // Clear existing markers from map
                markerObjects.forEach(obj => {
                    if (obj.marker) obj.marker.remove();
                });
                markerObjects = [];
                markerByAddressId.clear();
                
                // Check Firebase for marker version to determine if reset is needed
                // Only reset if markers.json was actually updated (not browser/cache issues)
                db.collection('mapSettings').doc('markerVersion').get().then(doc => {
                    const storedHash = doc.exists ? doc.data().markersHash : null;
                    
                    if (storedHash !== currentMarkersHash) {
                        console.log('Markers.json has been updated - clearing canvassing states...');
                        
                        // Update the stored version
                        db.collection('mapSettings').doc('markerVersion').set({
                            markersHash: currentMarkersHash,
                            lastUpdated: new Date().toISOString()
                        });
                        
                        // Reset marker states for new marker set
                        markers.forEach((marker, idx) => {
                            const addressId = createAddressId(marker.address);
                            db.collection('markerStates').doc(addressId).set({
                                state: '', // Clear canvassing state
                                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                            }, { merge: true }); // Preserve flag and notes
                        });
                    } else {
                        console.log('Same markers.json - preserving all Firebase states');
                    }
                }).catch(error => {
                    console.log('First time loading - setting up marker version tracking');
                    // First time setup
                    db.collection('mapSettings').doc('markerVersion').set({
                        markersHash: currentMarkersHash,
                        lastUpdated: new Date().toISOString()
                    });
                });
            
                markers.forEach((marker, idx) => {
                console.log(`Creating marker ${idx + 1} for:`, marker.address);
                const markerEl = createMarkerElement(idx + 1);
                const markerZone = getMarkerZone(marker);
                // Ensure all new markers start in default state (yellow, no flags)
                markerEl.style.backgroundColor = '#FFFF00'; // Default yellow
                setMarkerShape(markerEl, false, getMarkerDisplayLabel(idx, markerZone)); // No flag by default
                
                const popupContent = document.createElement('div');
                    
                    // Handle comma-separated names
                    const firstNames = marker.first.split(',').map(name => name.trim());
                    const lastNames = marker.last.split(',').map(name => name.trim());
                    const ages = (marker.age !== undefined && marker.age !== null)
                        ? String(marker.age).split(',').map(value => value.trim())
                        : [];
                    const parties = (marker.party !== undefined && marker.party !== null)
                        ? String(marker.party).split(',').map(value => value.trim())
                        : ((marker.Party !== undefined && marker.Party !== null)
                            ? String(marker.Party).split(',').map(value => value.trim())
                            : []);
                    
                    // Create name pairs (first + last)
                    let nameLines = '';
                    const maxNames = Math.max(firstNames.length, lastNames.length);
                    for (let i = 0; i < maxNames; i++) {
                        const firstName = firstNames[i] || '';
                        const lastName = lastNames[i] || '';
                        const ageValue = ages[i] || '';
                        const partyValue = parties[i] || '';
                        const suffixParts = [];
                        if (ageValue) suffixParts.push(ageValue);
                        if (partyValue) suffixParts.push(partyValue);
                        const personSuffix = suffixParts.length ? ` ${suffixParts.join(' ')}` : '';
                        nameLines += `<strong>${firstName} ${lastName}${personSuffix}</strong><br>`;
                    }
                    
                    popupContent.innerHTML = `
                        ${nameLines}
                        ${marker.address}<br>
                        ${markerZone ? `<small><strong>Zone:</strong> ${markerZone}</small><br>` : ''}
                        <label>
                            <input type="checkbox" id="visited-${idx}"> Dropped Literature
                        </label><br>
                        <label>
                            <input type="checkbox" id="friendly-${idx}"> Friendly
                        </label><br>
                        <label>
                            <input type="checkbox" id="notfriendly-${idx}"> Not Friendly
                        </label><br>
                        <label>
                            <input type="checkbox" id="flag-${idx}"> American Flag
                        </label><br>
                        <label style="display: block; margin-top: 10px;">
                            <strong>Notes:</strong><br>
                            <textarea id="notes-${idx}" placeholder="Add new note..."

                            <button type="button" id="add-note-${idx}" 
                                   style="margin-top: 5px; padding: 5px 10px; 
                                          background-color: #4CAF50; color: white; 
                                          border: none; border-radius: 3px; cursor: pointer;">
                                Add Note
                            </button>
                            <div id="notes-history-${idx}" 
                                 style="margin-top: 10px; max-height: 150px; 
                                        overflow-y: auto; border: 1px solid #ddd; 
                                        padding: 5px; background-color: #f9f9f9; 
                                        font-size: 11px;">
                                <em>No notes yet</em>
                            </div>
                        </label>
                    `;

                    const popup = new mapboxgl.Popup({ offset: 25 }).setDOMContent(popupContent);

                    // Load existing data when popup opens
                    popup.on('open', () => {
                        const addressId = createAddressId(marker.address);
                        db.collection('markerStates').doc(addressId).get().then(doc => {
                            const data = doc.exists ? doc.data() : {};
                            const state = data.state || '';

                            if (state === 'friendly') {

                                markerEl.style.backgroundColor = '#FFFF00';

                            setMarkerShape(markerEl, flag, getMarkerDisplayLabel(idx, markerZone));

                            const historyDiv = popupContent.querySelector(`#notes-history-${idx}`);
                            if (!notesHistory || notesHistory.length === 0) {
                                historyDiv.innerHTML = '<em>No notes yet</em>';
                            } else {
                                historyDiv.innerHTML = notesHistory
                                    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
                                    .map(note => `
                                        <div style="margin-bottom: 8px; padding: 5px; 
                                                   background-color: white; border-left: 3px solid #4CAF50;">
                                            <div style="font-weight: bold; color: #666; font-size: 10px;">
                                                ${note.timestamp}
                                            </div>
                                            <div style="margin-top: 2px;">
                                                ${note.text}
                                            </div>
                                        </div>
                                    `).join('');
                            }
                        });
                    });

                    const mapMarker = new mapboxgl.Marker(markerEl)
                        .setLngLat([marker.lng, marker.lat])
                        .setPopup(popup)
                        .addTo(map);

                    const markerObject = {
                        marker: mapMarker, 
                        idx: idx, 
                        markerEl: markerEl, 
                        popupContent: popupContent,
                        popup: popup,
                        address: marker.address,
                        zone: markerZone,
                        isVisible: true
                    };
                    markerObjects.push(markerObject);
                    markerByAddressId.set(createAddressId(marker.address), markerObject);

                    const visitedBox = popupContent.querySelector(`#visited-${idx}`);
                    const friendlyBox = popupContent.querySelector(`#friendly-${idx}`);
                    const notFriendlyBox = popupContent.querySelector(`#notfriendly-${idx}`);
                    const flagBox = popupContent.querySelector(`#flag-${idx}`);
                    const notesBox = popupContent.querySelector(`#notes-${idx}`);
                    const addNoteBtn = popupContent.querySelector(`#add-note-${idx}`);
                    const notesHistory = popupContent.querySelector(`#notes-history-${idx}`);

                    // Function to create safe document ID from address
                    function createAddressId(address) {
                        return address.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
                    }
                    
                    // Functions for timestamped notes
                    function addTimestampedNote(idx, noteText) {
                        if (!noteText.trim()) return;
                        
                        isUpdating = true; // Prevent listener conflicts
                        
                        const timestamp = new Date().toLocaleString();
                        const noteEntry = {
                            text: noteText.trim(),
                            timestamp: timestamp,
                            id: Date.now() // Unique ID for each note
                        };
                        
                        const addressId = createAddressId(marker.address);
                        console.log('Adding note - Address:', marker.address, '-> ID:', addressId);
                        
                        // Get existing notes from Firebase
                        db.collection('markerStates').doc(addressId).get().then(doc => {
                            const data = doc.data() || {};
                            const existingNotes = data.notesHistory || [];
                            const updatedNotes = [...existingNotes, noteEntry];
                            
                            // Update Firebase with new note
                            db.collection('markerStates').doc(addressId).update({
                                notesHistory: updatedNotes,
                                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                            }).then(() => {
                                // Immediately update the display with the new notes
                                displayNotesHistory(idx, updatedNotes);
                                setTimeout(() => { isUpdating = false; }, 100); // Re-enable listener after delay
                            });
                            
                            // Clear the input
                            notesBox.value = '';
                        });
                    }
                    
                    function displayNotesHistory(idx, notesHistoryArray) {
                        const historyDiv = popupContent.querySelector(`#notes-history-${idx}`);
                        if (!notesHistoryArray || notesHistoryArray.length === 0) {
                            historyDiv.innerHTML = '<em>No notes yet</em>';
                            return;
                        }
                        
                        historyDiv.innerHTML = notesHistoryArray
                            .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)) // Most recent first
                            .map(note => `
                                <div style="margin-bottom: 8px; padding: 5px; 
                                           background-color: white; border-left: 3px solid #4CAF50;">
                                    <div style="font-weight: bold; color: #666; font-size: 10px;">
                                        ${note.timestamp}
                                    </div>
                                    <div style="margin-top: 2px;">
                                        ${note.text}
                                    </div>
                                </div>
                            `).join('');
                    }

                    // Move these functions OUTSIDE the forEach loop
                    function setMarkerShape(markerEl, isStar, label) {
                        if (isStar) {
                            markerEl.style.backgroundColor = markerEl.style.backgroundColor || '#FFFF00';
                            markerEl.style.width = '42px';
                            markerEl.style.height = '42px';
                            markerEl.style.borderRadius = '0';
                            markerEl.style.fontSize = '16px';
                            markerEl.style.clipPath = 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)';
                            markerEl.textContent = label;
                        } else {
                            markerEl.style.width = '28px';
                            markerEl.style.height = '28px';
                            markerEl.style.borderRadius = '50%';
                            markerEl.style.clipPath = '';
                            markerEl.style.border = '2px solid black';
                            markerEl.style.fontSize = '16px';
                            markerEl.textContent = label;
                        }
                    }

                    function getManualLocationData() {
                        if (!proximityCurrentPosition || !proximityCurrentPosition.coords) {
                            return {};
                        }
                        const userLat = proximityCurrentPosition.coords.latitude;
                        const userLng = proximityCurrentPosition.coords.longitude;
                        const distFeet = haversineFeet(userLat, userLng, marker.lat, marker.lng);
                        return {
                            manualUpdateDistanceFeet: Math.round(distFeet * 10) / 10,
                            manualUpdateLocation: {
                                lat: userLat,
                                lng: userLng,
                                accuracyFeet: Math.round(metersToFeet(proximityCurrentPosition.coords.accuracy) * 10) / 10,
                                timestamp: firebase.firestore.FieldValue.serverTimestamp()
                            }
                        };
                    }

                    function handleExclusiveCheck(markerEl, visitedBox, friendlyBox, notFriendlyBox, flagBox, idx, selectedBox, address) {
                        isUpdating = true; // Prevent listener conflicts
                        
                        [visitedBox, friendlyBox, notFriendlyBox].forEach(box => {
                            if (box !== selectedBox) box.checked = false;
                        });

                        let state = '';
                        if (friendlyBox.checked) {
                            markerEl.style.backgroundColor = '#32CD32'; // Friendly: green
                            state = 'friendly';
                        } else if (notFriendlyBox.checked) {
                            markerEl.style.backgroundColor = '#FF4500'; // Not Friendly: orange-red
                            state = 'notfriendly';
                        } else if (visitedBox.checked) {
                            markerEl.style.backgroundColor = '#B39DDB'; // Dropped Literature: softer purple
                            state = 'visited';
                        } else {
                            markerEl.style.backgroundColor = '#FFFF00'; // Default: yellow
                            state = '';
                        }
                        setMarkerShape(markerEl, flagBox.checked, getMarkerDisplayLabel(idx, markerZone));

                        const addressId = createAddressId(address);
                        const cachedState = markerStateCache.get(addressId) || {};
                        if ((cachedState.state || '') === state && !!cachedState.flag === !!flagBox.checked) {
                            setTimeout(() => { isUpdating = false; }, 0);
                            return;
                        }
                        console.log('Writing to Firebase - Address:', address, '-> ID:', addressId, 'State:', state);
                        const updateData = { 
                            state, 
                            flag: flagBox.checked,
                            lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
                            ...getManualLocationData()
                        };
                        db.collection('markerStates').doc(addressId).set(updateData, { merge: true }).then(() => {
                            console.log('Successfully wrote to Firebase for:', addressId);
                            // Immediately update the visual state to ensure consistency
                            if (state === 'friendly') markerEl.style.backgroundColor = '#32CD32';
                            else if (state === 'notfriendly') markerEl.style.backgroundColor = '#FF4500';
                            else if (state === 'visited') markerEl.style.backgroundColor = '#B39DDB';
                            else markerEl.style.backgroundColor = '#FFFF00';
                            setMarkerShape(markerEl, flagBox.checked, getMarkerDisplayLabel(idx, markerZone));
                            setTimeout(() => { isUpdating = false; }, 100); // Re-enable listener after delay
                        });
                    }

                    // American Flag logic (independent)
                    flagBox.addEventListener('change', () => {
                        isUpdating = true; // Prevent listener conflicts
                        setMarkerShape(markerEl, flagBox.checked, getMarkerDisplayLabel(idx, markerZone));
                        let state = '';
                        if (friendlyBox.checked) state = 'friendly';
                        else if (notFriendlyBox.checked) state = 'notfriendly';
                        else if (visitedBox.checked) state = 'visited';
                        const addressId = createAddressId(marker.address);
                        const cachedState = markerStateCache.get(addressId) || {};
                        if ((cachedState.state || '') === state && !!cachedState.flag === !!flagBox.checked) {
                            setTimeout(() => { isUpdating = false; }, 0);
                            return;
                        }
                        const updateData = { 
                            state, 
                            flag: flagBox.checked,
                            lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
                            ...getManualLocationData()
                        };
                        db.collection('markerStates').doc(addressId).set(updateData, { merge: true }).then(() => {
                            setTimeout(() => { isUpdating = false; }, 100); // Re-enable listener after delay
                        });
                    });

                    // Attach event listeners for exclusive selection
                    visitedBox.addEventListener('change', () => handleExclusiveCheck(markerEl, visitedBox, friendlyBox, notFriendlyBox, flagBox, idx, visitedBox, marker.address));
                    friendlyBox.addEventListener('change', () => handleExclusiveCheck(markerEl, visitedBox, friendlyBox, notFriendlyBox, flagBox, idx, friendlyBox, marker.address));
                    notFriendlyBox.addEventListener('change', () => handleExclusiveCheck(markerEl, visitedBox, friendlyBox, notFriendlyBox, flagBox, idx, notFriendlyBox, marker.address));

                    // Initialize marker state in Firestore if it doesn't exist
                    const addressId = createAddressId(marker.address);
                    db.collection('markerStates').doc(addressId).get().then(doc => {
                        if (!doc.exists) {
                            db.collection('markerStates').doc(addressId).set({ 
                                state: '', 
                                flag: false, 
                                notesHistory: [],
                                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                    });

                    // Add note button functionality
                    addNoteBtn.addEventListener('click', () => {
                        addTimestampedNote(idx, notesBox.value);
                    });
                    
                    // Allow Enter key to add note
                    notesBox.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            addTimestampedNote(idx, notesBox.value);
                        }
                    });
                });

                if (zoneFilteringEnabled) {
                    applyZoneFilter(zoneSelect.value, true);
                }

                if (zoneFilteringEnabled) {
                    zoneSelect.addEventListener('change', () => {
                        if (!zoneSelect.value) {
                            applyZoneFilter('', false);
                            return;
                        }
                        if (zoneSelect.value !== 'all') {
                            history.pushState({ zone: zoneSelect.value }, '', window.location.href);
                        }
                        lockZoneSelection(zoneSelect.value);
                    });
                }
            })
            .catch(error => {
                console.error('Error loading markers.json:', error);
                console.error('Make sure markers.json is in the same directory as index.html');
                console.error('Make sure you are running from a web server (Live Server) not file:// protocol');
            });

        // Globe spinning logic
        let spinning = true;
        let spinSpeed = 0.5; // degrees per frame
        let spinAnimationId = null;

        function spinGlobe() {
            if (!spinning) return;
            const center = map.getCenter();
            map.easeTo({
                center: [center.lng + spinSpeed, center.lat],
                duration: 50,
                easing: t => t
            });
            spinAnimationId = requestAnimationFrame(spinGlobe);
        }

        // Start spinning on style load
        map.on('style.load', () => {
            spinning = true;
            spinGlobe();
        });

        // Pause spinning when user interacts with the map
        function pauseSpinning() {
            spinning = false;
            if (spinAnimationId) {
                cancelAnimationFrame(spinAnimationId);
                spinAnimationId = null;
            }
        }

        map.on('mousedown', pauseSpinning);
        map.on('wheel', pauseSpinning);
        map.on('touchstart', pauseSpinning);

        function bindMapActionButton(buttonId, handler) {
            const button = document.getElementById(buttonId);
            let handledTouch = false;

            button.addEventListener('touchend', (event) => {
                event.preventDefault();
                handledTouch = true;
                handler();
                setTimeout(() => {
                    handledTouch = false;
                }, 0);
            }, { passive: false });

            button.addEventListener('click', (event) => {
                if (handledTouch) {
                    return;
                }
                event.preventDefault();
                handler();
            });
        }

        zoomToIncludeMeButton.addEventListener('touchstart', (event) => {
            event.preventDefault();
            beginZoomButtonHold(event);
        }, { passive: false });

        zoomToIncludeMeButton.addEventListener('touchend', (event) => {
            event.preventDefault();
            if (!zoomButtonHoldTriggered) {
                zoomToIncludeMe();
            }
            zoomButtonTapHandled = true;
            cancelZoomButtonHold();
            setTimeout(() => {
                zoomButtonTapHandled = false;
                zoomButtonHoldTriggered = false;
            }, 0);
        }, { passive: false });

        zoomToIncludeMeButton.addEventListener('touchcancel', cancelZoomButtonHold);
        zoomToIncludeMeButton.addEventListener('mousedown', beginZoomButtonHold);
        zoomToIncludeMeButton.addEventListener('mouseup', () => {
            if (!zoomButtonHoldTriggered) {
                zoomToIncludeMe();
            }
            zoomButtonTapHandled = true;
            cancelZoomButtonHold();
            setTimeout(() => {
                zoomButtonTapHandled = false;
                zoomButtonHoldTriggered = false;
            }, 0);
        });
        zoomToIncludeMeButton.addEventListener('mouseleave', cancelZoomButtonHold);
        zoomToIncludeMeButton.addEventListener('click', (event) => {
            if (zoomButtonTapHandled || zoomButtonHoldTriggered) {
                event.preventDefault();
                return;
            }
            event.preventDefault();
            zoomToIncludeMe();
        });

        proximityStatusBadge.addEventListener('pointerdown', (event) => {
            event.preventDefault();
            beginProximityHoldToggle(event);
        });
        proximityStatusBadge.addEventListener('pointerup', cancelProximityHoldToggle);
        proximityStatusBadge.addEventListener('pointercancel', cancelProximityHoldToggle);
        proximityStatusBadge.addEventListener('pointerleave', cancelProximityHoldToggle);

        // Reset all markers using module-scoped helper functions.
        bindMapActionButton('reset-all-markers', async () => {
            pauseSpinning();
            try {
                const resetModule = await import('./reset-markers.js');
                let addressesToReset = null;
                let resetScopeLabel = 'all markers';

                if (zoneFilteringEnabled && zoneSelect.value && zoneSelect.value !== 'all') {
                    const selectedZone = zoneSelect.value;
                    addressesToReset = markerObjects
                        .filter(obj => obj.zone === selectedZone)
                        .map(obj => obj.address);
                    resetScopeLabel = `markers in ${selectedZone}`;

                    if (addressesToReset.length === 0) {
                        alert(`No markers found for ${selectedZone}.`);
                        return;
                    }
                }

                const result = await resetModule.resetAllMarkersWithPrompt(window.__markerResetContext, {
                    addresses: addressesToReset,
                    scopeLabel: resetScopeLabel
                });

                // Re-lock admin reset controls only after a reset actually runs.
                if (result && !result.cancelled) {
                    const unlockAdminButton = document.getElementById('unlock-admin-reset');
                    const resetAllButton = document.getElementById('reset-all-markers');
                    resetAllButton.classList.add('hidden');
                    unlockAdminButton.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Bulk reset failed:', error);
                alert(`Bulk reset failed: ${error.message || error}`);
            }
        });
        
        // Function to create safe document ID from address (global scope)
        function createAddressId(address) {
            return address.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
        }
        
        // Track if we're currently updating to prevent listener conflicts
        let isUpdating = false;
        
        // Update marker from Firestore
        db.collection('markerStates').onSnapshot(snapshot => {
            if (isUpdating) return; // Skip updates when user is actively clicking

            snapshot.docChanges().forEach(change => {
                const addressId = change.doc.id;
                const data = change.type === 'removed' ? {} : change.doc.data();
                queueMarkerStateUpdate(addressId, data);
            });
        });
        
        } // End of initializeMap function
    </script>
</body>
</html>
