<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mapbox Markers from JSON</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.1.0/mapbox-gl-geocoder.min.js"></script>
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.1.0/mapbox-gl-geocoder.css" type="text/css">
    <style>
        html,body { margin: 0; padding: 0; height: 100%; }
        #map {
            width: 100%;
            flex-grow: 1;
            height: 100%;
        }
        #container {
            display: flex;
            height: 100%;
        }
        /* Remove the sidebar styles */
        #sidebar {
            display: none;
        }
        button {
            display: block;
            margin-bottom: 10px;
            padding: 10px;
            width: 150px;
            cursor: pointer;
        }
        /* Password Protection Styles */
        #password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #password-form {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        #password-form h2 {
            margin-bottom: 20px;
            color: #333;
        }
        #password-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        #password-submit {
            width: 100%;
            padding: 12px;
            background-color: #007cba;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #password-submit:hover {
            background-color: #005a87;
        }
        #password-error {
            color: red;
            margin-top: 10px;
            display: none;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Password Protection Overlay -->
    <div id="password-overlay">
        <div id="password-form">
            <h2>🗺️ Map Access Required</h2>
            <p>Please enter the password to access the map:</p>
            <input type="password" id="password-input" placeholder="Enter password" autofocus>
            <button id="password-submit">Access Map</button>
            <div id="password-error">Incorrect password. Please try again.</div>
        </div>
    </div>

    <div id="container" class="hidden">
        <button id="zoom-to-markers" style="position:absolute;top:60px;left:20px;z-index:2;width:150px;padding:10px;background-color:#fff;">Zoom to Markers</button>
        <button id="zoom-to-include-me" style="position:absolute;top:100px;left:20px;z-index:2;width:150px;padding:10px;background-color:#fff;">Zoom to Include Me</button>
        <div id="map"></div>
    </div>
    <!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script>
        // Password Protection
        const CORRECT_PASSWORD = "Win2026"; // Change this to your desired password
        
        document.addEventListener('DOMContentLoaded', function() {
            const passwordOverlay = document.getElementById('password-overlay');
            const passwordInput = document.getElementById('password-input');
            const passwordSubmit = document.getElementById('password-submit');
            const passwordError = document.getElementById('password-error');
            const container = document.getElementById('container');

            // Handle password submission
            function checkPassword() {
                const enteredPassword = passwordInput.value;
                if (enteredPassword === CORRECT_PASSWORD) {
                    // Correct password - hide overlay and show map
                    passwordOverlay.classList.add('hidden');
                    container.classList.remove('hidden');
                    // Initialize the map after password is correct
                    initializeMap();
                } else {
                    // Wrong password - show error
                    passwordError.style.display = 'block';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }

            // Event listeners for password form
            passwordSubmit.addEventListener('click', checkPassword);
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    checkPassword();
                }
            });

            // Hide error when user starts typing
            passwordInput.addEventListener('input', function() {
                passwordError.style.display = 'none';
            });
        });

        // Move map initialization into a function
        function initializeMap() {
        // ADD YOUR ACCESS TOKEN FROM https://account.mapbox.com
        const INITIAL_CENTER = [-112, 33.3]; // Centered on the Ahwhatukee Foothills
        const INITIAL_ZOOM = 1.5; // Start zoomed out for globe effect
        mapboxgl.accessToken = 'pk.eyJ1Ijoid2pncnA1NTE4IiwiYSI6ImNtZmxxMm01MzA3c3oyaXExMWMxamVqZWoifQ.u2vTBRK2tHKi1HwI2JkhfA';
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v12',
            zoom: INITIAL_ZOOM,
            center: INITIAL_CENTER,
            projection: 'globe' // Enable globe view
        });

        // Add the geocoder control to the map.
        map.addControl(
            new MapboxGeocoder({
                accessToken: mapboxgl.accessToken,
                mapboxgl: mapboxgl,
                limit: 10, // Limit results to 10 in pulldown list
            })
        );

        // Add geolocation control and tracking
        map.addControl(new mapboxgl.GeolocateControl({
            positionOptions: {
                enableHighAccuracy: true
            },
            trackUserLocation: true,
            showUserHeading: true,
            showAccuracyCircle: true
        }));

        // Variable to store the current location marker
        let currentLocationMarker = null; 

        // Function to create a custom current location marker
        function createCurrentLocationMarker() {
            const el = document.createElement('div');
            el.style.backgroundColor = '#FF0000'; // Red color for current location
            el.style.width = '20px';
            el.style.height = '20px';
            el.style.borderRadius = '50%';
            el.style.display = 'flex';
            el.style.alignItems = 'center';
            el.style.justifyContent = 'center';
            el.style.color = 'white';
            el.style.fontWeight = 'bold';
            el.style.fontSize = '12px';
            el.style.border = '3px solid white';
            el.style.boxShadow = '0 0 10px rgba(0,0,0,0.5)';
            el.textContent = '📍';
            return el;
        }

        // Track user's current location
        function trackCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const { longitude, latitude } = position.coords;
                        
                        // Remove existing current location marker
                        if (currentLocationMarker) {
                            currentLocationMarker.remove();
                        }
                        
                        // Create new current location marker
                        const locationMarkerEl = createCurrentLocationMarker();
                        
                        const popup = new mapboxgl.Popup({ offset: 25 })
                            .setHTML(`
                                <strong>Your Current Location</strong><br>
                                Lat: ${latitude.toFixed(6)}<br>
                                Lng: ${longitude.toFixed(6)}<br>
                                <small>Accuracy: ±${position.coords.accuracy}m</small>
                            `);
                        
                        currentLocationMarker = new mapboxgl.Marker(locationMarkerEl)
                            .setLngLat([longitude, latitude])
                            .setPopup(popup)
                            .addTo(map);
                        
                        console.log('Location updated:', latitude, longitude);
                    },
                    (error) => {
                        console.error('Geolocation error:', error);
                        alert('Unable to retrieve your location. Please enable location services.');
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 10000 // Cache location for 10 seconds
                    }
                );
            } else {
                alert('Geolocation is not supported by this browser.');
            }
        }

        // Start tracking location when map loads
        map.on('load', () => {
            trackCurrentLocation();
        });

        // Store marker references and visited state
        let markerObjects = [];

        // Function to create a custom marker element with a visible numeric label
        function createMarkerElement(label) {
            const el = document.createElement('div');
            el.style.backgroundColor = '#FFFF00'; // Always start as yellow
            el.style.width = '28px';
            el.style.height = '28px';
            el.style.borderRadius = '50%';
            el.style.display = 'flex';
            el.style.alignItems = 'center';
            el.style.justifyContent = 'center';
            el.style.color = 'black';
            el.style.fontWeight = 'bold';
            el.style.fontSize = '16px';
            el.style.border = '2px solid black';
            el.textContent = label;
            return el;
        }

        // Place this BEFORE fetch('markers.json')
        function setMarkerShape(markerEl, isStar, label) {
            if (isStar) {
                markerEl.style.backgroundColor = markerEl.style.backgroundColor || '#FFFF00';
                markerEl.style.width = '42px';
                markerEl.style.height = '42px';
                markerEl.style.borderRadius = '0';
                markerEl.style.fontSize = '16px';
                markerEl.style.clipPath = 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)';
                markerEl.textContent = label;
            } else {
                markerEl.style.width = '28px';
                markerEl.style.height = '28px';
                markerEl.style.borderRadius = '50%';
                markerEl.style.clipPath = '';
                markerEl.style.border = '2px solid black';
                markerEl.style.fontSize = '16px';
                markerEl.textContent = label;
            }
        }

        // Load markers from markers.json and add to map with numeric labels
        console.log('Starting to fetch markers.json...');
        console.log('Map object:', map);
        fetch('markers.json')
            .then(response => {
                console.log('Fetch response status:', response.status);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(markers => {
                console.log('Loading markers...', markers.length, 'markers found');
                console.log('First marker:', markers[0]);
                
                // Create marker hash for version tracking
                const currentMarkersHash = JSON.stringify(markers.map(m => m.address).sort());
                
                console.log('Loading markers - real-time sync active');
                
                // Clear existing markers from map
                markerObjects.forEach(obj => {
                    if (obj.marker) obj.marker.remove();
                });
                markerObjects = [];
                
                // Check Firebase for marker version to determine if reset is needed
                // Only reset if markers.json was actually updated (not browser/cache issues)
                db.collection('mapSettings').doc('markerVersion').get().then(doc => {
                    const storedHash = doc.exists ? doc.data().markersHash : null;
                    
                    if (storedHash !== currentMarkersHash) {
                        console.log('Markers.json has been updated - clearing canvassing states...');
                        
                        // Update the stored version
                        db.collection('mapSettings').doc('markerVersion').set({
                            markersHash: currentMarkersHash,
                            lastUpdated: new Date().toISOString()
                        });
                        
                        // Reset marker states for new marker set
                        markers.forEach((marker, idx) => {
                            const addressId = createAddressId(marker.address);
                            db.collection('markerStates').doc(addressId).set({
                                state: '' // Clear canvassing state
                            }, { merge: true }); // Preserve flag and notes
                        });
                    } else {
                        console.log('Same markers.json - preserving all Firebase states');
                    }
                }).catch(error => {
                    console.log('First time loading - setting up marker version tracking');
                    // First time setup
                    db.collection('mapSettings').doc('markerVersion').set({
                        markersHash: currentMarkersHash,
                        lastUpdated: new Date().toISOString()
                    });
                });
            
                markers.forEach((marker, idx) => {
                console.log(`Creating marker ${idx + 1} for:`, marker.address);
                const markerEl = createMarkerElement(idx + 1);
                // Ensure all new markers start in default state (yellow, no flags)
                markerEl.style.backgroundColor = '#FFFF00'; // Default yellow
                setMarkerShape(markerEl, false, idx + 1); // No flag by default
                
                const popupContent = document.createElement('div');
                    
                    // Handle comma-separated names
                    const firstNames = marker.first.split(',').map(name => name.trim());
                    const lastNames = marker.last.split(',').map(name => name.trim());
                    
                    // Create name pairs (first + last)
                    let nameLines = '';
                    const maxNames = Math.max(firstNames.length, lastNames.length);
                    for (let i = 0; i < maxNames; i++) {
                        const firstName = firstNames[i] || '';
                        const lastName = lastNames[i] || '';
                        nameLines += `<strong>${firstName} ${lastName}</strong><br>`;
                    }
                    
                    popupContent.innerHTML = `
                        ${nameLines}
                        ${marker.address}<br>
                        <label>
                            <input type="checkbox" id="visited-${idx}"> Dropped Literature
                        </label><br>
                        <label>
                            <input type="checkbox" id="friendly-${idx}"> Friendly
                        </label><br>
                        <label>
                            <input type="checkbox" id="notfriendly-${idx}"> Not Friendly
                        </label><br>
                        <label>
                            <input type="checkbox" id="reset-${idx}"> Reset
                        </label><br>
                        <label>
                            <input type="checkbox" id="flag-${idx}"> American Flag
                        </label><br>
                        <label style="display: block; margin-top: 10px;">
                            <strong>Notes:</strong><br>
                            <textarea id="notes-${idx}" placeholder="Add new note..." 
                                     style="width: 200px; height: 60px; margin-top: 5px; 
                                            resize: vertical; font-family: Arial, sans-serif; 
                                            font-size: 12px; padding: 5px;"></textarea><br>
                            <button type="button" id="add-note-${idx}" 
                                   style="margin-top: 5px; padding: 5px 10px; 
                                          background-color: #4CAF50; color: white; 
                                          border: none; border-radius: 3px; cursor: pointer;">
                                Add Note
                            </button>
                            <div id="notes-history-${idx}" 
                                 style="margin-top: 10px; max-height: 150px; 
                                        overflow-y: auto; border: 1px solid #ddd; 
                                        padding: 5px; background-color: #f9f9f9; 
                                        font-size: 11px;">
                                <em>No notes yet</em>
                            </div>
                        </label>
                    `;

                    const popup = new mapboxgl.Popup({ offset: 25 }).setDOMContent(popupContent);

                    // Load existing data when popup opens
                    popup.on('open', () => {
                        const addressId = createAddressId(marker.address);
                        db.collection('markerStates').doc(addressId).get().then(doc => {
                            if (doc.exists) {
                                const data = doc.data();
                                const flag = data.flag;
                                const notesHistory = data.notesHistory || [];
                                
                                // Keep canvassing states unchecked (reset for new session)
                                popupContent.querySelector(`#friendly-${idx}`).checked = false;
                                popupContent.querySelector(`#notfriendly-${idx}`).checked = false;
                                popupContent.querySelector(`#visited-${idx}`).checked = false;
                                
                                // Preserve flag status
                                popupContent.querySelector(`#flag-${idx}`).checked = !!flag;
                                
                                // Keep marker in default state (yellow) regardless of previous canvassing state
                                markerEl.style.backgroundColor = '#FFFF00';
                                
                                // Update marker shape based on preserved flag status
                                setMarkerShape(markerEl, !!flag, idx + 1);
                                
                                // Display preserved notes history
                                const historyDiv = popupContent.querySelector(`#notes-history-${idx}`);
                                if (!notesHistory || notesHistory.length === 0) {
                                    historyDiv.innerHTML = '<em>No notes yet</em>';
                                } else {
                                    historyDiv.innerHTML = notesHistory
                                        .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
                                        .map(note => `
                                            <div style="margin-bottom: 8px; padding: 5px; 
                                                       background-color: white; border-left: 3px solid #4CAF50;">
                                                <div style="font-weight: bold; color: #666; font-size: 10px;">
                                                    ${note.timestamp}
                                                </div>
                                                <div style="margin-top: 2px;">
                                                    ${note.text}
                                                </div>
                                            </div>
                                        `).join('');
                                }
                            }
                        });
                    });

                    const mapMarker = new mapboxgl.Marker(markerEl)
                        .setLngLat([marker.lng, marker.lat])
                        .setPopup(popup)
                        .addTo(map);

                    markerObjects.push({ 
                        marker: mapMarker, 
                        idx: idx, 
                        markerEl: markerEl, 
                        popupContent: popupContent,
                        address: marker.address 
                    });

                    const visitedBox = popupContent.querySelector(`#visited-${idx}`);
                    const friendlyBox = popupContent.querySelector(`#friendly-${idx}`);
                    const notFriendlyBox = popupContent.querySelector(`#notfriendly-${idx}`);
                    const resetBox = popupContent.querySelector(`#reset-${idx}`);
                    const flagBox = popupContent.querySelector(`#flag-${idx}`);
                    const notesBox = popupContent.querySelector(`#notes-${idx}`);
                    const addNoteBtn = popupContent.querySelector(`#add-note-${idx}`);
                    const notesHistory = popupContent.querySelector(`#notes-history-${idx}`);

                    // Function to create safe document ID from address
                    function createAddressId(address) {
                        return address.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
                    }
                    
                    // Functions for timestamped notes
                    function addTimestampedNote(idx, noteText) {
                        if (!noteText.trim()) return;
                        
                        isUpdating = true; // Prevent listener conflicts
                        
                        const timestamp = new Date().toLocaleString();
                        const noteEntry = {
                            text: noteText.trim(),
                            timestamp: timestamp,
                            id: Date.now() // Unique ID for each note
                        };
                        
                        const addressId = createAddressId(marker.address);
                        console.log('Adding note - Address:', marker.address, '-> ID:', addressId);
                        
                        // Get existing notes from Firebase
                        db.collection('markerStates').doc(addressId).get().then(doc => {
                            const data = doc.data() || {};
                            const existingNotes = data.notesHistory || [];
                            const updatedNotes = [...existingNotes, noteEntry];
                            
                            // Update Firebase with new note
                            db.collection('markerStates').doc(addressId).update({
                                notesHistory: updatedNotes
                            }).then(() => {
                                // Immediately update the display with the new notes
                                displayNotesHistory(idx, updatedNotes);
                                setTimeout(() => { isUpdating = false; }, 100); // Re-enable listener after delay
                            });
                            
                            // Clear the input
                            notesBox.value = '';
                        });
                    }
                    
                    function displayNotesHistory(idx, notesHistoryArray) {
                        const historyDiv = popupContent.querySelector(`#notes-history-${idx}`);
                        if (!notesHistoryArray || notesHistoryArray.length === 0) {
                            historyDiv.innerHTML = '<em>No notes yet</em>';
                            return;
                        }
                        
                        historyDiv.innerHTML = notesHistoryArray
                            .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)) // Most recent first
                            .map(note => `
                                <div style="margin-bottom: 8px; padding: 5px; 
                                           background-color: white; border-left: 3px solid #4CAF50;">
                                    <div style="font-weight: bold; color: #666; font-size: 10px;">
                                        ${note.timestamp}
                                    </div>
                                    <div style="margin-top: 2px;">
                                        ${note.text}
                                    </div>
                                </div>
                            `).join('');
                    }

                    // Move these functions OUTSIDE the forEach loop
                    function setMarkerShape(markerEl, isStar, label) {
                        if (isStar) {
                            markerEl.style.backgroundColor = markerEl.style.backgroundColor || '#FFFF00';
                            markerEl.style.width = '42px';
                            markerEl.style.height = '42px';
                            markerEl.style.borderRadius = '0';
                            markerEl.style.fontSize = '16px';
                            markerEl.style.clipPath = 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)';
                            markerEl.textContent = label;
                        } else {
                            markerEl.style.width = '28px';
                            markerEl.style.height = '28px';
                            markerEl.style.borderRadius = '50%';
                            markerEl.style.clipPath = '';
                            markerEl.style.border = '2px solid black';
                            markerEl.style.fontSize = '16px';
                            markerEl.textContent = label;
                        }
                    }

                    function handleExclusiveCheck(markerEl, visitedBox, friendlyBox, notFriendlyBox, resetBox, flagBox, idx, selectedBox, address) {
                        isUpdating = true; // Prevent listener conflicts
                        
                        [visitedBox, friendlyBox, notFriendlyBox].forEach(box => {
                            if (box !== selectedBox) box.checked = false;
                        });
                        resetBox.checked = false;

                        let state = '';
                        if (friendlyBox.checked) {
                            markerEl.style.backgroundColor = '#32CD32'; // Friendly: green
                            state = 'friendly';
                        } else if (notFriendlyBox.checked) {
                            markerEl.style.backgroundColor = '#FF4500'; // Not Friendly: orange-red
                            state = 'notfriendly';
                        } else if (visitedBox.checked) {
                            markerEl.style.backgroundColor = '#B39DDB'; // Dropped Literature: softer purple
                            state = 'visited';
                        } else {
                            markerEl.style.backgroundColor = '#FFFF00'; // Default: yellow
                            state = '';
                        }
                        setMarkerShape(markerEl, flagBox.checked, idx + 1);

                        const addressId = createAddressId(address);
                        console.log('Writing to Firebase - Address:', address, '-> ID:', addressId, 'State:', state);
                        db.collection('markerStates').doc(addressId).set({ 
                            state, 
                            flag: flagBox.checked
                        }, { merge: true }).then(() => {
                            console.log('Successfully wrote to Firebase for:', addressId);
                            // Immediately update the visual state to ensure consistency
                            if (state === 'friendly') markerEl.style.backgroundColor = '#32CD32';
                            else if (state === 'notfriendly') markerEl.style.backgroundColor = '#FF4500';
                            else if (state === 'visited') markerEl.style.backgroundColor = '#B39DDB';
                            else markerEl.style.backgroundColor = '#FFFF00';
                            setMarkerShape(markerEl, flagBox.checked, idx + 1);
                            setTimeout(() => { isUpdating = false; }, 100); // Re-enable listener after delay
                        });
                    }

                    // Reset logic
                    resetBox.addEventListener('change', () => {
                        if (resetBox.checked) {
                            isUpdating = true; // Prevent listener conflicts
                            visitedBox.checked = false;
                            friendlyBox.checked = false;
                            notFriendlyBox.checked = false;
                            markerEl.style.backgroundColor = '#FFFF00';
                            notesBox.value = '';
                            setMarkerShape(markerEl, flagBox.checked, idx + 1);
                            const addressId = createAddressId(marker.address);
                            db.collection('markerStates').doc(addressId).set({ 
                                state: '', 
                                flag: flagBox.checked,
                                notesHistory: [] // Clear all notes history
                            }, { merge: true }).then(() => {
                                setTimeout(() => { isUpdating = false; }, 100); // Re-enable listener after delay
                            });
                            resetBox.checked = false; // Uncheck after reset
                        }
                    });

                    // American Flag logic (independent)
                    flagBox.addEventListener('change', () => {
                        isUpdating = true; // Prevent listener conflicts
                        setMarkerShape(markerEl, flagBox.checked, idx + 1);
                        let state = '';
                        if (friendlyBox.checked) state = 'friendly';
                        else if (notFriendlyBox.checked) state = 'notfriendly';
                        else if (visitedBox.checked) state = 'visited';
                        const addressId = createAddressId(marker.address);
                        db.collection('markerStates').doc(addressId).set({ 
                            state, 
                            flag: flagBox.checked
                        }, { merge: true }).then(() => {
                            setTimeout(() => { isUpdating = false; }, 100); // Re-enable listener after delay
                        });
                    });

                    // Attach event listeners for exclusive selection
                    visitedBox.addEventListener('change', () => handleExclusiveCheck(markerEl, visitedBox, friendlyBox, notFriendlyBox, resetBox, flagBox, idx, visitedBox, marker.address));
                    friendlyBox.addEventListener('change', () => handleExclusiveCheck(markerEl, visitedBox, friendlyBox, notFriendlyBox, resetBox, flagBox, idx, friendlyBox, marker.address));
                    notFriendlyBox.addEventListener('change', () => handleExclusiveCheck(markerEl, visitedBox, friendlyBox, notFriendlyBox, resetBox, flagBox, idx, notFriendlyBox, marker.address));

                    // Initialize marker state in Firestore if it doesn't exist
                    const addressId = createAddressId(marker.address);
                    db.collection('markerStates').doc(addressId).get().then(doc => {
                        if (!doc.exists) {
                            db.collection('markerStates').doc(addressId).set({ 
                                state: '', 
                                flag: false, 
                                notesHistory: []
                            });
                        }
                    });

                    // Add note button functionality
                    addNoteBtn.addEventListener('click', () => {
                        addTimestampedNote(idx, notesBox.value);
                    });
                    
                    // Allow Enter key to add note
                    notesBox.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            addTimestampedNote(idx, notesBox.value);
                        }
                    });
                });
            })
            .catch(error => {
                console.error('Error loading markers.json:', error);
                console.error('Make sure markers.json is in the same directory as index.html');
                console.error('Make sure you are running from a web server (Live Server) not file:// protocol');
            });

        // Globe spinning logic
        let spinning = true;
        let spinSpeed = 0.5; // degrees per frame
        let spinAnimationId = null;

        function spinGlobe() {
            if (!spinning) return;
            const center = map.getCenter();
            map.easeTo({
                center: [center.lng + spinSpeed, center.lat],
                duration: 50,
                easing: t => t
            });
            spinAnimationId = requestAnimationFrame(spinGlobe);
        }

        // Start spinning on style load
        map.on('style.load', () => {
            spinning = true;
            spinGlobe();
        });

        // Pause spinning when user interacts with the map
        function pauseSpinning() {
            spinning = false;
            if (spinAnimationId) {
                cancelAnimationFrame(spinAnimationId);
                spinAnimationId = null;
            }
        }

        map.on('mousedown', pauseSpinning);
        map.on('wheel', pauseSpinning);
        map.on('touchstart', pauseSpinning);

        // Zoom to Markers
        document.getElementById('zoom-to-markers').addEventListener('click', () => {
            pauseSpinning();
            if (markerObjects.length === 0) return;
            const bounds = new mapboxgl.LngLatBounds();
            markerObjects.forEach(obj => {
                const lngLat = obj.marker.getLngLat();
                bounds.extend([lngLat.lng, lngLat.lat]);
            });
            map.fitBounds(bounds, {
                padding: 50,
                maxZoom: 16 // Prevent zooming in too close
            });
        });

        // Zoom to Include Me
        document.getElementById('zoom-to-include-me').addEventListener('click', () => {
            pauseSpinning();
            if (markerObjects.length === 0 && !currentLocationMarker) return;
            
            const bounds = new mapboxgl.LngLatBounds();
            
            // Add all marker locations to bounds
            markerObjects.forEach(obj => {
                const lngLat = obj.marker.getLngLat();
                bounds.extend([lngLat.lng, lngLat.lat]);
            });
            
            // Add current location to bounds if available
            if (currentLocationMarker) {
                const currentLngLat = currentLocationMarker.getLngLat();
                bounds.extend([currentLngLat.lng, currentLngLat.lat]);
            }
            
            map.fitBounds(bounds, {
                padding: 50,
                maxZoom: 16 // Prevent zooming in too close
            });
        });

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCm-dDUMYN4JLdIyt0FT0BzBIRLCHXm8EU",
            authDomain: "maps4canvasing.firebaseapp.com",
            projectId: "maps4canvasing",
            storageBucket: "maps4canvasing.firebasestorage.app",
            messagingSenderId: "913974581293",
            appId: "1:913974581293:web:201a7403bc5d9c82d900a4",
            measurementId: "G-X0G2YNP37H"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Test Firebase connection
        console.log('Firebase initialized, testing connection...');
        db.collection('markerStates').limit(1).get().then(snapshot => {
            console.log('Firebase connection test successful. Documents found:', snapshot.size);
        }).catch(error => {
            console.error('Firebase connection test failed:', error);
        });

        // Function to create safe document ID from address (global scope)
        function createAddressId(address) {
            return address.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
        }
        
        // Track if we're currently updating to prevent listener conflicts
        let isUpdating = false;
        
        // Update marker from Firestore
        db.collection('markerStates').onSnapshot(snapshot => {
            if (isUpdating) return; // Skip updates when user is actively clicking
            
            console.log('Firebase snapshot received with', snapshot.docs.length, 'documents');
            
            snapshot.forEach(doc => {
                const addressId = doc.id;
                const data = doc.data();
                const state = data.state;
                const flag = data.flag;
                const notesHistory = data.notesHistory || [];
                
                console.log('Processing Firebase doc:', addressId, 'with state:', state);
                
                // Find marker object by matching address
                const obj = markerObjects.find(o => {
                    const markerAddressId = createAddressId(o.address);
                    console.log('Comparing:', markerAddressId, 'with', addressId);
                    return markerAddressId === addressId;
                });
                if (!obj) {
                    console.log('No marker object found for address:', addressId);
                    return;
                }
                
                console.log('Updating marker for address:', addressId);
                
                // Always restore states from Firebase (real-time sync)
                const idx = obj.idx;
                obj.popupContent.querySelector(`#friendly-${idx}`).checked = state === 'friendly';
                obj.popupContent.querySelector(`#notfriendly-${idx}`).checked = state === 'notfriendly';
                obj.popupContent.querySelector(`#visited-${idx}`).checked = state === 'visited';
                
                // Update marker color based on Firebase state
                if (state === 'friendly') obj.markerEl.style.backgroundColor = '#32CD32';
                else if (state === 'notfriendly') obj.markerEl.style.backgroundColor = '#FF4500';
                else if (state === 'visited') obj.markerEl.style.backgroundColor = '#B39DDB';
                else obj.markerEl.style.backgroundColor = '#FFFF00'; // Default yellow
                
                // Always update flag status and notes (these are preserved)
                const idx = obj.idx;
                obj.popupContent.querySelector(`#flag-${idx}`).checked = !!flag;
                obj.popupContent.querySelector(`#reset-${idx}`).checked = false;
                
                // Display notes history
                const historyDiv = obj.popupContent.querySelector(`#notes-history-${idx}`);
                if (!notesHistory || notesHistory.length === 0) {
                    historyDiv.innerHTML = '<em>No notes yet</em>';
                } else {
                    historyDiv.innerHTML = notesHistory
                        .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
                        .map(note => `
                            <div style="margin-bottom: 8px; padding: 5px; 
                                       background-color: white; border-left: 3px solid #4CAF50;">
                                <div style="font-weight: bold; color: #666; font-size: 10px;">
                                    ${note.timestamp}
                                </div>
                                <div style="margin-top: 2px;">
                                    ${note.text}
                                </div>
                            </div>
                        `).join('');
                }
                
                // Update marker shape based on flag (always preserve flag)
                if (flag) setMarkerShape(obj.markerEl, true, idx + 1);
                else setMarkerShape(obj.markerEl, false, idx + 1);
            });
            console.log('Firestore update received', snapshot.docs.map(doc => doc.data()));
        });
        
        } // End of initializeMap function
    </script>
</body>
